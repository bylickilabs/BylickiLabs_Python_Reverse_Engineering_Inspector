name: Python 3.12 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-312-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate pyproject.toml
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          from pathlib import Path

          path = Path("pyproject.toml")
          with path.open("rb") as file:
              data = tomllib.load(file)

          assert data["project"]["name"] == "bylickilabs-python-reverse-engineering-inspector"
          assert data["project"]["version"]
          assert data["project"]["requires-python"] == ">=3.10"

          print("pyproject.toml validation passed")
          PY

      - name: Compile Python source
        run: python -m compileall -q main.py src

      - name: Verify core imports
        run: |
          python - <<'PY'
          import numpy
          import scipy
          import PySide6

          import src.config
          import src.localization
          import src.models
          import src.analyzers.bytecode_analyzer
          import src.analyzers.project_analyzer
          import src.services.database
          import src.services.exporter
          import src.ui.main_window

          print("Core import validation passed")
          PY

      - name: Verify localization symmetry
        run: |
          python - <<'PY'
          from src.localization import TRANSLATIONS

          assert "de" in TRANSLATIONS, "German localization is missing"
          assert "en" in TRANSLATIONS, "English localization is missing"

          de_keys = set(TRANSLATIONS["de"])
          en_keys = set(TRANSLATIONS["en"])

          missing_in_en = sorted(de_keys - en_keys)
          missing_in_de = sorted(en_keys - de_keys)

          assert not missing_in_en, f"Missing English keys: {missing_in_en}"
          assert not missing_in_de, f"Missing German keys: {missing_in_de}"

          print(f"Localization symmetry passed with {len(de_keys)} keys per language")
          PY

      - name: Ruff diagnostics
        run: ruff check . --output-format=github --exit-zero

      - name: Run pytest when tests exist
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest test files found yet. Pytest step skipped."
          fi
